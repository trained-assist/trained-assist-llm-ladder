name: query-ladder-logs
on:
  workflow_dispatch:
    inputs:
      hours:
        description: How many hours back to query
        default: "24"
      needle:
        description: Substring to search in log messages
        default: "attempts"
      raw:
        description: Dump full raw JSON of the first events (true/false)
        default: "false"

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Query Workers Observability
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          HOURS: ${{ inputs.hours }}
          NEEDLE: ${{ inputs.needle }}
          RAW: ${{ inputs.raw }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          TOKEN = os.environ['CLOUDFLARE_API_TOKEN']
          ACCT = os.environ['CLOUDFLARE_ACCOUNT_ID']
          HOURS = float(os.environ.get('HOURS') or 24)
          NEEDLE = os.environ.get('NEEDLE') or 'attempts'
          RAW = (os.environ.get('RAW') or 'false').lower() == 'true'
          BASE = f'https://api.cloudflare.com/client/v4/accounts/{ACCT}'
          now = int(time.time() * 1000)
          frm = int(now - HOURS * 3600 * 1000)

          def post(path, payload):
              req = urllib.request.Request(
                  BASE + path,
                  data=json.dumps(payload).encode(),
                  headers={'Authorization': f'Bearer {TOKEN}', 'Content-Type': 'application/json'},
                  method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return {'http_error': e.code, 'body': e.read().decode()[:3000]}
              except Exception as e:
                  return {'error': str(e)}

          def find_events(res):
              found = []

              def walk(o):
                  if isinstance(o, dict):
                      for k, v in o.items():
                          if k == 'events' and isinstance(v, list) and v and isinstance(v[0], dict):
                              found.extend(v)
                          else:
                              walk(v)
                  elif isinstance(o, list):
                      for v in o:
                          walk(v)

              walk(res.get('result'))
              return found

          print('=== keys ===')
          keys = post('/workers/observability/telemetry/keys', {})
          print(json.dumps(keys, ensure_ascii=False)[:5000])

          res = post('/workers/observability/telemetry/query', {
              'queryId': 'adhoc-ladder-logs',
              'timeframe': {'from': frm, 'to': now},
              'view': 'events',
              'parameters': {'limit': 200, 'needle': {'value': NEEDLE, 'isRegex': False, 'matchCase': False}},
          })
          print('=== query success:', res.get('success'))
          if not res.get('success'):
              print(json.dumps(res, ensure_ascii=False)[:4000])
              raise SystemExit(0)
          events = find_events(res)
          print('=== events:', len(events))
          if events:
              print('EVENT KEYS:', sorted(events[0].keys()))
              if RAW:
                  for e in events[:5]:
                      print('RAW>', json.dumps(e, ensure_ascii=False)[:4000])
          # Fallback: print whatever text-ish fields each event carries
          for i, e in enumerate(events[:200]):
              md = e.get('$metadata') or {}
              ts = md.get('timestamp') or md.get('startTime') or e.get('timestamp') or ''
              parts = []
              for k in ('message', 'text', 'level', 'dataset', 'source', 'stringFields'):
                  if k in e:
                      v = e[k]
                      parts.append(f'{k}={json.dumps(v, ensure_ascii=False) if not isinstance(v, str) else v}')
              # nested cloudflare/message shapes
              for k, v in e.items():
                  if isinstance(v, dict):
                      for kk, vv in v.items():
                          if isinstance(vv, str) and ('attempts' in vv or 'ladder' in vv or 'opencode-go' in vv):
                              parts.append(f'{k}.{kk}={vv[:1200]}')
              print(f'[{i}]', ts, '|', ' | '.join(parts)[:2000])
          PY
