name: query-ladder-logs
on:
  workflow_dispatch:
    inputs:
      hours:
        description: How many hours back for the attempts aggregation
        default: "8"
      step_min:
        description: Window size in minutes for the attempts aggregation
        default: "10"
      needle:
        description: Substring for the attempts aggregation
        default: "attempts"
      regex_hours:
        description: Hours back for the key-rotated/quota regex sweep (0 = skip)
        default: "72"

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Query Workers Observability
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          HOURS: ${{ inputs.hours }}
          STEP_MIN: ${{ inputs.step_min }}
          NEEDLE: ${{ inputs.needle }}
          REGEX_HOURS: ${{ inputs.regex_hours }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, collections, datetime

          TOKEN = os.environ['CLOUDFLARE_API_TOKEN']
          ACCT = os.environ['CLOUDFLARE_ACCOUNT_ID']
          HOURS = float(os.environ.get('HOURS') or 8)
          STEP = int(float(os.environ.get('STEP_MIN') or 10)) * 60 * 1000
          NEEDLE = os.environ.get('NEEDLE') or 'attempts'
          REGEX_HOURS = float(os.environ.get('REGEX_HOURS') or 0)
          BASE = f'https://api.cloudflare.com/client/v4/accounts/{ACCT}'
          now = int(time.time() * 1000)
          UTC = lambda ms: datetime.datetime.fromtimestamp(int(ms)/1000, datetime.timezone.utc).strftime('%m-%d %H:%M:%S')

          def post(path, payload):
              req = urllib.request.Request(
                  BASE + path, data=json.dumps(payload).encode(),
                  headers={'Authorization': f'Bearer {TOKEN}', 'Content-Type': 'application/json'},
                  method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return {'http_error': e.code, 'body': e.read().decode()[:3000]}
              except Exception as e:
                  return {'error': str(e)}

          def find_events(res):
              found = []
              def walk(o):
                  if isinstance(o, dict):
                      for k, v in o.items():
                          if k == 'events' and isinstance(v, list) and v and isinstance(v[0], dict):
                              found.extend(v)
                          else:
                              walk(v)
                  elif isinstance(o, list):
                      for v in o:
                          walk(v)
              walk(res.get('result'))
              return found

          def sweep(frm, to, step, needle=None, regex=None):
              out = []
              t = to
              capped = 0
              while t > frm:
                  w = max(t - step, frm)
                  n = {'value': needle or '', 'isRegex': False, 'matchCase': False}
                  if regex:
                      n = {'value': regex, 'isRegex': True, 'matchCase': False}
                  res = post('/workers/observability/telemetry/query', {
                      'queryId': 'adhoc-ladder-sweep',
                      'timeframe': {'from': w, 'to': t},
                      'view': 'events',
                      'parameters': {'limit': 500, 'needle': n},
                  })
                  if res.get('success'):
                      evs = [e for e in find_events(res)
                             if ((e.get('$workers') or {}).get('scriptName')) == 'trained-assist-llm-ladder']
                      if len(evs) >= 50:
                          capped += 1
                      out.extend(evs)
                  else:
                      print('WINDOW FAIL', json.dumps(res)[:500])
                  t = w
              if capped:
                  print(f'!! {capped} windows hit the 50-event cap (data truncated)')
              return out

          if REGEX_HOURS > 0:
              print(f'=== REGEX SWEEP last {REGEX_HOURS}h: key-rotated|usage limit|quota|credential|429 ===')
              evs = sweep(now - REGEX_HOURS*3600*1000, now, 30*60*1000,
                          regex=r'key-rotated|usage limit|quota exceeded|invalid credential|HTTP 429')
              print('regex hits:', len(evs))
              for e in evs[:100]:
                  src = e.get('source') or {}
                  print(UTC(e.get('timestamp') or 0), '|', json.dumps(src, ensure_ascii=False)[:1000])

              print('\n=== ALL key-rotated events (7d) ===')
              evs = sweep(now - 7*24*3600*1000, now, 60*60*1000, needle='key-rotated')
              print('key-rotated events:', len(evs))
              for e in evs[:100]:
                  src = e.get('source') or {}
                  print(UTC(e.get('timestamp') or 0), '|', json.dumps(src, ensure_ascii=False)[:1200])

              print('\n=== ALL openrouter-served deepseek calls (7d, needle=model name) ===')
              evs = sweep(now - 7*24*3600*1000, now, 60*60*1000, needle='openrouter/deepseek/deepseek-v4-flash-0731')
              print('mentions:', len(evs))
              served_oh = 0
              for e in evs:
                  src = e.get('source') or {}
                  if src.get('model', '').startswith('openrouter/'):
                      served_oh += 1
                      print(UTC(e.get('timestamp') or 0), '|', json.dumps(src, ensure_ascii=False)[:1000])
              print('served-by-openrouter:', served_oh)

          print(f'\n=== ATTEMPTS SWEEP last {HOURS}h step {STEP//60000}m needle={NEEDLE} ===')
          frm = now - HOURS*3600*1000
          evs = sweep(frm, now, STEP, needle=NEEDLE)
          print('events:', len(evs))
          served = collections.Counter()
          interesting = []
          for e in evs:
              src = e.get('source') or {}
              if not isinstance(src, dict):
                  continue
              served[(src.get('ladder'), src.get('model'))] += 1
              ats = src.get('attempts') or []
              has_err = any(a.get('outcome') == 'error' for a in ats)
              m = src.get('model') or ''
              if has_err or (isinstance(m, str) and m.startswith('openrouter/')) or src.get('ok') is False:
                  interesting.append((UTC(e.get('timestamp') or 0), src))
          print('\n--- served histogram ---')
          for k, v in served.most_common(30):
              print(f'{v:5d}  {k}')
          print(f'\n--- calls with errors or served by OpenRouter ({len(interesting)}) ---')
          for ts, src in interesting:
              print(ts, '|', json.dumps(src, ensure_ascii=False)[:1300])
          PY
