name: query-ladder-logs
on:
  workflow_dispatch:
    inputs:
      hours:
        description: How many hours back to query
        default: "24"
      needle:
        description: Substring to search in log messages
        default: "attempts"

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Query Workers Observability
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          HOURS: ${{ inputs.hours }}
          NEEDLE: ${{ inputs.needle }}
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, collections, datetime

          TOKEN = os.environ['CLOUDFLARE_API_TOKEN']
          ACCT = os.environ['CLOUDFLARE_ACCOUNT_ID']
          HOURS = float(os.environ.get('HOURS') or 24)
          NEEDLE = os.environ.get('NEEDLE') or 'attempts'
          BASE = f'https://api.cloudflare.com/client/v4/accounts/{ACCT}'
          now = int(time.time() * 1000)
          frm = int(now - HOURS * 3600 * 1000)

          def post(path, payload):
              req = urllib.request.Request(
                  BASE + path, data=json.dumps(payload).encode(),
                  headers={'Authorization': f'Bearer {TOKEN}', 'Content-Type': 'application/json'},
                  method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return {'http_error': e.code, 'body': e.read().decode()[:3000]}
              except Exception as e:
                  return {'error': str(e)}

          def find_events(res):
              found = []
              def walk(o):
                  if isinstance(o, dict):
                      for k, v in o.items():
                          if k == 'events' and isinstance(v, list) and v and isinstance(v[0], dict):
                              found.extend(v)
                          else:
                              walk(v)
                  elif isinstance(o, list):
                      for v in o:
                          walk(v)
              walk(res.get('result'))
              return found

          # 30-minute windows, newest first, aggregate everything
          STEP = 30 * 60 * 1000
          events = []
          t = now
          while t > frm:
              w_from = max(t - STEP, frm)
              res = post('/workers/observability/telemetry/query', {
                  'queryId': 'adhoc-ladder-agg',
                  'timeframe': {'from': w_from, 'to': t},
                  'view': 'events',
                  'parameters': {'limit': 500, 'needle': {'value': NEEDLE, 'isRegex': False, 'matchCase': False}},
              })
              if not res.get('success'):
                  print('WINDOW FAIL', json.dumps(res)[:800])
              else:
                  evs = [e for e in find_events(res)
                         if ((e.get('$workers') or {}).get('scriptName')) == 'trained-assist-llm-ladder']
                  events.extend(evs)
                  print(f'window {datetime.datetime.utcfromtimestamp(w_from/1000):%m-%d %H:%M} -> {len(evs)}')
              t = w_from

          print('TOTAL EVENTS:', len(events))
          served = collections.Counter()
          errors = collections.Counter()
          rotations = []
          descents = []
          failures = []
          for e in events:
              src = e.get('source') or {}
              if not isinstance(src, dict):
                  continue
              ts = e.get('timestamp') or e.get('$metadata', {}).get('timestamp')
              def fmt(ms):
                  try:
                      return datetime.datetime.utcfromtimestamp(int(ms)/1000).strftime('%m-%d %H:%M:%S')
                  except Exception:
                      return '?'
              served[(src.get('ladder'), src.get('model'))] += 1
              for a in (src.get('attempts') or []):
                  if a.get('outcome') == 'error' and a.get('error'):
                      errors[a['error'][:160]] += 1
                  if a.get('outcome') == 'key-rotated':
                      rotations.append((fmt(ts), src.get('ladder'), a.get('model'), (a.get('error') or '')[:200]))
              m = src.get('model') or ''
              if isinstance(m, str) and m.startswith('openrouter/'):
                  descents.append((fmt(ts), src.get('ladder'), m,
                                   [(a.get('model'), a.get('outcome'), (a.get('error') or '')[:120])
                                    for a in (src.get('attempts') or [])]))
              if src.get('ok') is False:
                  failures.append((fmt(ts), src.get('ladder'), src.get('error') or '',
                                   [(a.get('model'), a.get('outcome'), (a.get('error') or '')[:120])
                                    for a in (src.get('attempts') or [])]))

          print('\n=== SERVED (ladder, model) histogram ===')
          for k, v in served.most_common(40):
              print(f'{v:5d}  {k}')
          print('\n=== DISTINCT ERROR STRINGS ===')
          for k, v in errors.most_common(40):
              print(f'{v:5d}  {k}')
          print(f'\n=== KEY ROTATIONS ({len(rotations)}) ===')
          for r in rotations[:60]:
              print(r)
          print(f'\n=== CALLS SERVED BY OPENROUTER ({len(descents)}) ===')
          for d in descents[:80]:
              print(d)
          print(f'\n=== FULL LADDER FAILURES ({len(failures)}) ===')
          for f in failures[:40]:
              print(f)
          PY
