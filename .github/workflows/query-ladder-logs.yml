name: query-ladder-logs
on:
  workflow_dispatch:
    inputs:
      hours:
        description: How many hours back to query
        default: "24"
      needle:
        description: Substring to search in log messages
        default: "attempts"

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Query Workers Observability
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          NOW=$(date +%s000)
          FROM=$(date -d "-${{ inputs.hours }} hours" +%s000)

          echo "=== 1) telemetry keys ==="
          curl -sS "${AUTH[@]}" -X POST "${BASE}/workers/observability/telemetry/keys" -d '{}' | head -c 4000
          echo

          echo "=== 2) events query (needle=${{ inputs.needle }}) ==="
          curl -sS "${AUTH[@]}" -X POST "${BASE}/workers/observability/telemetry/query" -d "{
            \"queryId\": \"adhoc-ladder-logs\",
            \"timeframe\": {\"from\": ${FROM}, \"to\": ${NOW}},
            \"view\": \"events\",
            \"parameters\": {
              \"limit\": 300,
              \"needle\": {\"value\": \"${{ inputs.needle }}\", \"isRegex\": false, \"matchCase\": false}
            }
          }" > /tmp/q.json
          head -c 6000 /tmp/q.json
          echo

          echo "=== 3) extract events ==="
          python3 - <<'PY'
          import json, datetime
          try:
              d = json.load(open('/tmp/q.json'))
          except Exception as e:
              print('parse failed', e); raise SystemExit
          if not d.get('success', False):
              print('QUERY FAILED:', json.dumps(d.get('errors'))[:2000]); raise SystemExit
          res = d.get('result') or {}
          evs = ((res.get('run') or {}).get('query') or {})
          events = (res.get('events') or {}).get('events') or []
          print('event count:', len(events))
          for e in events[:300]:
              md = e.get('$metadata') or {}
              ts = md.get('timestamp') or md.get('startTime')
              msg = e.get('message') or e.get('text') or ''
              print('---', ts, md.get('scriptName',''), '|', str(msg)[:900])
          PY
