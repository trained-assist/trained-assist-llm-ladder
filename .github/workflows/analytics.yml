name: ladder-analytics
on:
  workflow_dispatch:
    inputs:
      days:
        description: How many days back
        default: "7"
      format:
        description: md or json
        default: md
  schedule:
    # Daily digest. Off the hour to dodge the GitHub cron stampede.
    - cron: '37 6 * * *'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DAYS: ${{ github.event.inputs.days || '7' }}
          FORMAT: ${{ github.event.inputs.format || 'md' }}
        run: |
          set -euo pipefail
          REPORT="$(python3 scripts/analytics.py)"
          printf '%s\n' "$REPORT"
          if [ "${FORMAT:-md}" = "md" ]; then
            printf '%s\n' "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi
