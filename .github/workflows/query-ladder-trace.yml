name: query-ladder-trace
on:
  workflow_dispatch:
    inputs:
      preset:
        description: recent | trace | user | chat | session | summary | sql
        default: recent
      value:
        description: Id for trace/user/chat/session presets
        default: ""
      hours:
        description: How many hours back
        default: "24"
      limit:
        description: Max rows (<=1000)
        default: "50"
      sql:
        description: Read-only SELECT for preset=sql
        default: ""

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query D1 trace log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PRESET: ${{ inputs.preset }}
          VALUE: ${{ inputs.value }}
          HOURS: ${{ inputs.hours }}
          LIMIT: ${{ inputs.limit }}
          SQL: ${{ inputs.sql }}
        run: python3 scripts/query-trace.py
