name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Worker bundles
        run: npx --yes wrangler@4 deploy --dry-run --outdir=dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Provision D1 trace database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if CREATE_OUT=$(npx --yes wrangler@4 d1 create trained-assist-llm-ladder-trace 2>&1); then
            DB_ID=$(printf '%s' "$CREATE_OUT" | grep -oE 'database_id = "[0-9a-f-]+"' | grep -oE '[0-9a-f-]{36}')
          else
            DB_ID=$(npx --yes wrangler@4 d1 list --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print([x.get("uuid") for x in d if x.get("name")=="trained-assist-llm-ladder-trace"][0])')
          fi
          echo "DB_ID=$DB_ID" >> "$GITHUB_ENV"
          # Scoped to database_id: wrangler.toml now carries the same placeholder uuid twice
          # (D1 + KV), and an unscoped s|a|b| would rewrite both lines with one id.
          sed -i "/^database_id =/s|00000000-0000-0000-0000-000000000000|$DB_ID|" wrangler.toml
      - name: Provision KV credential store
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if CREATE_OUT=$(npx --yes wrangler@4 kv namespace create trained-assist-llm-ladder-creds 2>&1); then
            KV_ID=$(printf '%s' "$CREATE_OUT" | grep -oE '[0-9a-f]{32}' | head -1)
          else
            KV_ID=$(npx --yes wrangler@4 kv namespace list | python3 -c 'import json,sys; d=json.load(sys.stdin); print([x.get("id") for x in d if x.get("title")=="trained-assist-llm-ladder-creds"][0])')
          fi
          [ -n "$KV_ID" ] || { echo "could not resolve the KV namespace id"; exit 1; }
          echo "KV_ID=$KV_ID" >> "$GITHUB_ENV"
          sed -i "/^id =/s|00000000-0000-0000-0000-000000000000|$KV_ID|" wrangler.toml
      - name: Apply trace schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute trained-assist-llm-ladder-trace --file schema/ladder_calls.sql --remote
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --var BUILD_SHA:${{ github.sha }}
      - name: Smoke
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS https://llm-ladder.trainedassist.store/health && exit 0
            sleep 10
          done
          exit 1
